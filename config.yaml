# Settings for training and testing (read by shravan/config.py). Paths are relative to this folder, or start with ~.

texts: texts                        # copied from the site by scripts/sync_texts.py; texts/SOURCE says from which commit
audio: "~/Library/Mobile Documents/com~apple~CloudDocs/development/shravan-model/recordings"   # iCloud Drive; never in git
work: work                          # clips and alignments made from the audio; private, kept out of git
recordings: recordings.csv
# What another Mac needs to train, copied to iCloud Drive by scripts/backup.py and brought back by its --restore. Beside
# the recordings, not in their folder: a recording is looked for by its file name anywhere under audio: (locate()).
backup: "~/Library/Mobile Documents/com~apple~CloudDocs/development/shravan-model/training-kit"   # iCloud Drive; never in git
backup_keep:
  - work/align                      # where each unit starts and ends in each recording
  - work/clips                      # the clips training reads, with their labels
  - work/audio                      # each recording at 16 kHz, which cut.py, evaluate.py and follow.py read
  - checkpoints/ctc-pro-all/best    # chant-v4, the model on the site: to export again or to compare a new one with

# Vakyansh's wav2vec2 base (95M) fine-tuned on 60 hours of Sanskrit, writing Devanagari letter by letter, one letter per
# 20 ms: what scripts/train_ctc.py starts from
model: Harveenchadha/vakyansh-wav2vec2-sanskrit-sam-60

# Never trained on: the test scores mean something only on chanting the model has not heard. Three whole hymns
# (Pavamana Suktam 9.61–9.63, about 13% of the clean audio), used once per model at the end, never to choose anything.
heldout_hymns: [61, 62, 63]
# Not trained on either: training picks its best checkpoint by these (about 9%), so they can't also be the test.
validation_hymns: [46, 47, 48, 49, 50, 64]
# A verse whose alignment scores below this may not match its label (a verse the chanter skipped, say): left out.
min_alignment_score: 0.3
# A family recording trained on is held to more: its clean verses score 0.75 or more, so one below this is most likely a
# fumble, a mispronunciation or a gap, and is not trained on (a held-out recording keeps the bar above, for its test).
min_alignment_score_family: 0.5

training:
  precision: fp32                   # the M4's half precision is unreliable for training
  batch_size: 8                     # clips on the GPU at once
  accumulate: 1                     # batches added up before each update, so every update learns from 8 clips
  gpu_memory: 0.75                  # share of the GPU memory macOS recommends (shravan/env.py), about 11 GB of 16
  checkpointing: true               # recompute activations in the backward pass: a batch of 8 needs 5 GB instead of over 13
  learning_rate: 2.0e-5
  warmup_steps: 100                 # steps from no learning to the full rate
  max_steps: 6000                   # an upper bound: training stops earlier when validation stops improving
  sort_by_length: true              # batches of clips of about one length, so little silence is added to any clip: the
                                    # model's first layer normalises over the whole clip, padding included
                                    # (feat_extract_norm: group), and on the phone it never hears padding
  pad_to_seconds: 1                 # a batch's sound is padded up to a whole number of these, so the GPU sees few shapes
  family_validation: 0.1            # the last part of each family recording chooses the checkpoint, not trains it
  eval_every: 100                   # letters wrong on the validation clips; the best checkpoint is kept
  patience: 6                       # evaluations in a row without improving before stopping
  augment: true                     # random speed (±10%), volume and a little noise, so one chanter's takes aren't
                                    # simply memorised
  family_repeat: 3                  # each family clip counts this many times per pass: an hour of a published recording
                                    # would otherwise drown out a few minutes of the voices the app must follow
  seed: 1

targets:
  character_error_rate: 0.15
  line_found_within_3s: 0.95

# How Listen finds the place, as the site has it (js/features/listen.js, js/core/follow.js), so scripts/follow.py scores
# the app's own method (shravan/follow.py). When the site changes one of these, change it here too.
listen:
  window: 4           # seconds heard each time
  back: 60            # letters before the mark and after it lined up with the window
  forth: 250
  fit: -0.6           # the least fit believed (log-probability a step below the model's own reading)
  cover: 10           # the fewest letters a fit must cover
  recent: 1           # seconds at the window's end that must fit near the mark too
  tail: 2.5           # when they don't, the letters of the last seconds looked for first
  least: 10           # the fewest letters heard worth looking for
  ahead: 400          # letters after the place last found looked in first
  near: 0.4           # letters wrong, for each letter heard, believed near the place, in its text, anywhere
  text: 0.35
  any: 0.3
  pace: 7             # letters a second the mark moves on at, from the place last found
  step_ms: 20         # ms of sound each of the model's outputs covers
