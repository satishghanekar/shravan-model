# Settings for training and testing (read by shravan/config.py). Paths are relative to this folder, or start with ~.

texts: texts                        # copied from the site by scripts/sync_texts.py; texts/SOURCE says from which commit
audio: "~/Library/Mobile Documents/com~apple~CloudDocs/development/shravan-training"   # iCloud Drive; never in git
work: work                          # clips and alignments made from the audio; private, kept out of git
recordings: recordings.csv

model: openai/whisper-base          # the phone model; openai/whisper-small for the accuracy reference
language: sa                        # Whisper's language token: Sanskrit for the Vedic chants (Marathi, mr, comes later)

# Never trained on: the test scores mean something only on chanting the model has not heard. Three whole hymns
# (Pavamana Suktam 9.61–9.63, about 13% of the clean audio), used once per model at the end, never to choose anything.
heldout_hymns: [61, 62, 63]
# Not trained on either: training picks its best checkpoint by these (about 9%), so they can't also be the test.
validation_hymns: [46, 47, 48, 49, 50, 64]
# A verse whose alignment scores below this may not match its label (a verse the chanter skipped, say): left out.
min_alignment_score: 0.3

training:
  precision: fp32                   # the M4's half precision is unreliable for training
  batch_size:                       # clips on the GPU at once
    openai/whisper-base: 8
    openai/whisper-small: 4
  accumulate:                       # batches added up before each update, so every update learns from 8 clips
    openai/whisper-base: 1
    openai/whisper-small: 2
  gpu_memory:                       # share of the GPU memory macOS recommends (shravan/env.py), about 11 GB of 16
    openai/whisper-base: 0.75       # about 9 GB; base needs 6
    openai/whisper-small: 0.9       # small's optimizer state alone is 2 GB, and at 0.75 it ran out when resuming
  checkpointing: true               # recompute activations in the backward pass: a batch of 8 needs 5 GB instead of over 13
  learning_rate:                    # the usual rates for fine-tuning each size: larger models need gentler steps
    openai/whisper-base: 2.5e-5
    openai/whisper-small: 1.0e-5
  warmup_steps: 50
  max_steps: 2000                   # an upper bound: training stops earlier when validation stops improving
  eval_every: 100                   # letters wrong on the validation clips; the best checkpoint is kept
  patience: 5                       # evaluations in a row without improving before stopping
  augment: true                     # random speed (±10%), volume and a little noise, so one chanter's takes aren't
                                    # simply memorised
  seed: 1

targets:
  character_error_rate: 0.15
  line_found_within_3s: 0.95
